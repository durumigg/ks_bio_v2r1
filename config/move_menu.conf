[menu move homing homex]
name: {{ gettext('Home X') }}
icon: home-x
method: printer.gcode.script
params: {"script":"G28 X"}

[menu move homing homey]
name: {{ gettext('Home Y') }}
icon: home-y
method: printer.gcode.script
params: {"script":"G28 Y"}

[menu move homing homez]
name: {{ gettext('Home Z') }}
icon: home-z
method: printer.gcode.script
params: {"script":"G28 Z"}

[menu move homing homeu]
name: {{ gettext('Home U') }}
icon: tool-x
method: printer.gcode.script
params: {"script":"U0 HOME"}

[menu move homing homev]
name: {{ gettext('Home V') }}
icon: cleaner-y
method: printer.gcode.script
params: {"script":"V0 HOME"}

[menu move homing hometz1]
name: {{ gettext('Home TZ1') }}
icon: tool-z
method: printer.gcode.script
params: {"script":"A0 HOME"}

[menu move homing hometz2]
name: {{ gettext('Home TZ2') }}
icon: tool-z
method: printer.gcode.script
params: {"script":"A1 HOME"}

[menu move homing hometz3]
name: {{ gettext('Home TZ3') }}
icon: tool-z
method: printer.gcode.script
params: {"script":"A2 HOME"}

[menu move homing homeall]
name: {{ gettext('Home All') }}
icon: home
method: printer.gcode.script
params: {"script":"all_home_init"}

[menu move homing quad_gantry_level]
name: {{ gettext('Quad Gantry Level') }}
icon: home-z
method: printer.gcode.script
params: {"script":"QUAD_GANTRY_LEVEL"}
enable: {{ 'quad_gantry_level' in printer.config_sections }}

[menu move homing Z-Tilt]
name: {{ gettext('Z Tilt') }}
icon: z-tilt
method: printer.gcode.script
params: {"script":"Z_TILT_ADJUST"}
enable: {{ 'z_tilt' in printer.config_sections }}
